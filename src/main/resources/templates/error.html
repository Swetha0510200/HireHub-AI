<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireHub AI | Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: 'Poppins', sans-serif;
            padding: 1.5rem;
        }
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.08);
            border: 1px solid #e2e8f0;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.5rem;
        }
        .error-code {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.75rem;
        }
        .error-msg {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn-home {
            background: #0284c7;
            color: #ffffff;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }
        .btn-home:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div class="error-code" th:text="${status != null ? status : 500}">500</div>
        <div class="error-title" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Something Went Wrong</div>
        <p class="error-msg" th:text="${errorMessage != null ? errorMessage : 'We encountered an error processing your request. Please navigate back to your dashboard.'}">
            We encountered an error processing your request.
        </p>
        <a th:href="@{/dashboard}" class="btn-home">
            <i class="fa-solid fa-house"></i> Return to Dashboard
        </a>
    </div>
</div>
</body>
</html>
